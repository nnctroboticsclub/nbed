# nbed 開発環境（NUCLEO-F446RE）

[platformio]
description = nbed library development and hardware examples
default_envs = f4-blink
src_dir = examples
build_dir = build
build_cache_dir = .cache

; -----------------------------------------------------------------------------
; NUCLEO-F446RE 向け共通設定
; -----------------------------------------------------------------------------
[env]
platform = ststm32@20.0.0
framework = stm32cube
board = nucleo_f446re
platform_packages =
  toolchain-gccarmnoneeabi@1.140201.0
  framework-stm32cubef4@1.28.3
board_build.stm32cube.custom_config_header = yes
; Build the library in this checkout, without copying or downloading nbed.
lib_deps = nbed=symlink://.
extra_scripts = pre:scripts/compiledb.py
upload_protocol = stlink
monitor_speed = 921600
monitor_filters = direct


# nbedテスト環境 - F4全機能
[env:00-f4-all-test]
build_src_filter = -<*> +<${this.__env__}/>
build_flags = 
  -DNBED_NO_DEFAULT_SERIAL

# nbedテスト環境 - F4デジタル入出力テスト
[env:01-f4-digital-test]
build_src_filter = -<*> +<${this.__env__}/>

# nbedテスト環境 - F4アナログ入出力テスト
[env:02-f4-analog-test]
build_src_filter = -<*> +<${this.__env__}/>

# nbedテスト環境 - F4PWMテスト
[env:03-f4-pwm-test]
build_src_filter = -<*> +<${this.__env__}/>

# nbedテスト環境 - F4UARTテスト
[env:04-f4-uart-test]
build_src_filter = -<*> +<${this.__env__}/>
build_flags = 
  -DNBED_NO_DEFAULT_SERIAL

# nbedテスト環境 - F4CANテスト
[env:05-f4-can-test]
build_src_filter = -<*> +<${this.__env__}/>

# nbed コード例
[env:06-f4-nbed-example]
build_src_filter = -<*> +<${this.__env__}/>

; Board LED only; no external wiring is required.
[env:f4-blink]
build_src_filter = -<*> +<${this.__env__}/>

; F303K8 uses HSI/2 x 16 = 64 MHz; no external oscillator required.
[f3]
board = nucleo_f303k8
board_build.f_cpu = 64000000L
platform_packages =
  toolchain-gccarmnoneeabi@1.140201.0
  framework-stm32cubef3@1.11.5

[env:f3-blink]
board = ${f3.board}
board_build.f_cpu = ${f3.board_build.f_cpu}
platform_packages = ${f3.platform_packages}
build_src_filter = -<*> +<${this.__env__}/>

[env:f3-all-test]
board = ${f3.board}
board_build.f_cpu = ${f3.board_build.f_cpu}
platform_packages = ${f3.platform_packages}
build_src_filter = -<*> +<${this.__env__}/>
build_flags = -DNBED_NO_DEFAULT_SERIAL

; TIM15 uses PA2/PA3, so USART2 must not claim PA2 as the default console.
[env:f3-pwm-test]
board = ${f3.board}
board_build.f_cpu = ${f3.board_build.f_cpu}
platform_packages = ${f3.platform_packages}
build_src_filter = -<*> +<${this.__env__}/>
build_flags = -DNBED_NO_DEFAULT_SERIAL

; CH1/CH1N pair with HAL dead-time configuration; see docs/pwm.md.
[env:f4-pwm-complementary]
build_src_filter = -<*> +<pwm-complementary/>
build_flags = -DNBED_NO_DEFAULT_SERIAL

[env:f3-pwm-complementary]
board = ${f3.board}
board_build.f_cpu = ${f3.board_build.f_cpu}
platform_packages = ${f3.platform_packages}
build_src_filter = -<*> +<pwm-complementary/>
build_flags = -DNBED_NO_DEFAULT_SERIAL

; Connect D11 (MOSI) to D12 (MISO); see docs/spi.md.
[env:f4-spi-test]
build_src_filter = -<*> +<spi-loopback/>

[env:f3-spi-test]
board = ${f3.board}
board_build.f_cpu = ${f3.board_build.f_cpu}
platform_packages = ${f3.platform_packages}
build_src_filter = -<*> +<spi-loopback/>

; NUCLEO-F767ZI, HSE bypass 8 MHz -> 216 MHz, data/heap/stack in SRAM1/2.
[f7]
board = nucleo_f767zi
platform_packages =
  toolchain-gccarmnoneeabi@1.140201.0
  framework-stm32cubef7@1.17.2

[env:f7-blink]
board = ${f7.board}
platform_packages = ${f7.platform_packages}
board_upload.maximum_ram_size = 393216
build_src_filter = -<*> +<${this.__env__}/>

[env:f7-all-test]
board = ${f7.board}
platform_packages = ${f7.platform_packages}
board_upload.maximum_ram_size = 393216
build_src_filter = -<*> +<${this.__env__}/>

[env:f7-spi-test]
board = ${f7.board}
platform_packages = ${f7.platform_packages}
board_upload.maximum_ram_size = 393216
build_src_filter = -<*> +<spi-loopback/>

[env:f7-pwm-complementary]
board = ${f7.board}
platform_packages = ${f7.platform_packages}
board_upload.maximum_ram_size = 393216
build_src_filter = -<*> +<pwm-complementary/>
build_flags = -DNBED_NO_DEFAULT_SERIAL

; PA0 input, event count, and optional ISR callback; see docs/exti.md.
[env:f4-exti-test]
build_src_filter = -<*> +<exti-input/>

[env:f3-exti-test]
board = ${f3.board}
board_build.f_cpu = ${f3.board_build.f_cpu}
platform_packages = ${f3.platform_packages}
build_src_filter = -<*> +<exti-input/>

[env:f7-exti-test]
board = ${f7.board}
platform_packages = ${f7.platform_packages}
board_upload.maximum_ram_size = 393216
build_src_filter = -<*> +<exti-input/>

[env:f3-ws2812b]
board = ${f3.board}
platform_packages = ${f3.platform_packages}
board_build.f_cpu = ${f3.board_build.f_cpu}
build_src_filter = -<*> +<ws2812b/>

[env:f4-ws2812b]
build_src_filter = -<*> +<ws2812b/>

[env:f7-ws2812b]
board = ${f7.board}
platform_packages = ${f7.platform_packages}
board_upload.maximum_ram_size = 393216
build_src_filter = -<*> +<ws2812b/>

[env:f3-uart-dma]
board = ${f3.board}
platform_packages = ${f3.platform_packages}
board_build.f_cpu = ${f3.board_build.f_cpu}
build_src_filter = -<*> +<uart-dma/>
build_flags = -DNBED_NO_DEFAULT_SERIAL

[env:f4-uart-dma]
